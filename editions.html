<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chomp Chomp Editions</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a">

  <meta name="description" content="Books from Chomp Chomp Editions, plus a few recommended reads.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chom.ps/editions">
  <meta property="og:title" content="Chomp Chomp Editions">
  <meta property="og:description" content="Books from Chomp Chomp Editions, plus a few recommended reads.">
  <meta property="twitter:card" content="summary">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">

  <style>
    .editions-intro {
      text-align: center;
      padding: 24px 20px 0;
    }

    .editions-intro p {
      font-size: 0.95em;
      color: var(--color-text-muted);
      margin: 0 0 6px;
    }

    .editions-section {
      max-width: 680px;
      margin: 0 auto 36px;
      padding: 0 20px;
    }

    .editions-header {
      font-size: 0.75em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--color-text-muted);
      text-align: center;
      margin: 30px 0 14px;
    }

    /* Own books */
    .book {
      display: flex;
      gap: 24px;
      padding: 24px 0;
      border-top: 1px solid var(--color-border);
    }

    .book:last-child {
      border-bottom: 1px solid var(--color-border);
    }

    .book-cover {
      flex: 0 0 150px;
    }

    .book-cover img {
      width: 150px;
      height: auto;
      display: block;
      border-radius: 3px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
    }

    .book-body {
      flex: 1;
      min-width: 0;
    }

    .book-status {
      font-size: 0.7em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--color-accent);
      margin: 0 0 6px;
    }

    .book-title {
      font-size: 1.35em;
      font-weight: 500;
      line-height: 1.3;
      margin: 0 0 2px;
    }

    .book-subtitle {
      font-size: 0.95em;
      color: var(--color-text-muted);
      margin: 0 0 4px;
    }

    .book-meta {
      font-size: 0.8em;
      color: var(--color-text-muted);
      margin: 0 0 14px;
    }

    .book-desc p {
      font-size: 0.95em;
      line-height: 1.65;
      margin: 0 0 12px;
    }

    .book-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .book-links .btn {
      text-decoration: none;
      font-size: 0.875em;
      padding: 8px 18px;
    }

    /* Affiliate picks */
    .affiliate-note {
      font-size: 0.8em;
      color: var(--color-text-muted);
      text-align: center;
      margin: 0 0 8px;
    }

    .pick {
      display: flex;
      gap: 14px;
      align-items: baseline;
      padding: 14px 0;
      border-top: 1px solid var(--color-border);
    }

    .pick:last-child {
      border-bottom: 1px solid var(--color-border);
    }

    .pick-img {
      width: 48px;
      height: auto;
      border-radius: 2px;
      align-self: center;
    }

    .pick-main {
      flex: 1;
      min-width: 0;
    }

    .pick-title {
      display: block;
      font-weight: 500;
      color: var(--color-text);
      text-decoration: none;
      line-height: 1.4;
    }

    .pick-title:hover {
      color: var(--color-accent);
    }

    .pick-by,
    .pick-note {
      font-size: 0.85em;
      color: var(--color-text-muted);
      margin: 2px 0 0;
      line-height: 1.5;
    }

    .pick-source {
      font-size: 0.75em;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .editions-empty {
      text-align: center;
      color: var(--color-text-muted);
      padding: 24px 0;
    }

    @media (max-width: 768px) {
      .book {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .book-links {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="site-nav">
      <div class="header-left"></div>

      <div class="header-center">
        <a href="https://chom.ps" title="Chomp Chomp">
          <img src="https://ik.imagekit.io/chompchomp/Chomp%20Chomp%20logo%20light" alt="Chomp Chomp" class="header-banner banner-light">
          <img src="https://ik.imagekit.io/chompchomp/Chomp%20Chomp%20logo%20dark"  alt="Chomp Chomp" class="header-banner banner-dark">
        </a>
      </div>

      <div class="header-right">
        <div class="nav-tools-dropdown">
          <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">☰</button>
          <ul class="tools-dropdown-menu" id="toolsDropdown">
            <li><a href="https://chom.ps">chom.ps</a></li>
            <li><a href="https://ps.chom.ps">ps.chom.ps</a></li>
            <li><a href="https://chom.ps/about">chom.ps/about</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="page-container">

    <div class="editions-intro">
      <h1 style="font-size:1.4em;font-weight:500;margin:0 0 8px;">Chomp Chomp Editions</h1>
      <p id="intro"></p>
    </div>

    <section class="editions-section" id="booksSection">
      <div class="editions-header">Books</div>
      <div id="books"></div>
    </section>

    <section class="editions-section" id="picksSection" hidden>
      <div class="editions-header">Recommended</div>
      <p class="affiliate-note" id="affiliateNote"></p>
      <div id="picks"></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Baking is the materialization of comfort itself.</p>
      <p style="margin-top: 20px; font-size: 0.85em;">&copy; 2026 Chomp Chomp</p>
    </div>
  </footer>

  <script>
    // Menu toggle
    const toggle = document.getElementById('menuToggle');
    const menu = document.getElementById('toolsDropdown');
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('active');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-tools-dropdown')) {
        menu.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    // Content (all text comes from editions.json; escape before inserting)
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Only allow http(s) links
    const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? esc(u) : '#';

    const paragraphs = (text) =>
      esc(text).split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

    function renderBook(b) {
      const links = (b.links || []).map((l, i) =>
        `<a class="btn ${i === 0 ? 'btn-primary' : 'btn-outline'}" href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label || 'Buy')}</a>`
      ).join('');
      return `
        <article class="book">
          ${b.cover ? `<div class="book-cover"><img src="${esc(b.cover)}" alt="${esc(b.title)} cover" loading="lazy"></div>` : ''}
          <div class="book-body">
            ${b.status ? `<p class="book-status">${esc(b.status)}</p>` : ''}
            <h2 class="book-title">${esc(b.title)}</h2>
            ${b.subtitle ? `<p class="book-subtitle">${esc(b.subtitle)}</p>` : ''}
            <p class="book-meta">${[b.author, b.details].filter(Boolean).map(esc).join(' · ')}</p>
            ${b.description ? `<div class="book-desc">${paragraphs(b.description)}</div>` : ''}
            ${links ? `<div class="book-links">${links}</div>` : ''}
          </div>
        </article>`;
    }

    function renderPick(p) {
      const sponsored = /amazon\.|amzn\./i.test(p.url || '') ? 'sponsored ' : '';
      return `
        <div class="pick">
          ${p.image ? `<img class="pick-img" src="${esc(p.image)}" alt="" loading="lazy">` : ''}
          <div class="pick-main">
            <a class="pick-title" href="${safeUrl(p.url)}" target="_blank" rel="${sponsored}noopener">${esc(p.title)}</a>
            ${p.by ? `<p class="pick-by">${esc(p.by)}</p>` : ''}
            ${p.note ? `<p class="pick-note">${esc(p.note)}</p>` : ''}
          </div>
          ${p.source ? `<span class="pick-source">${esc(p.source)}</span>` : ''}
        </div>`;
    }

    async function load() {
      try {
        const res = await fetch('/editions.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();

        document.getElementById('intro').textContent = data.intro || '';

        const books = (data.books || []).filter((b) => !b.hidden);
        document.getElementById('books').innerHTML = books.length
          ? books.map(renderBook).join('')
          : '<p class="editions-empty">Nothing here yet.</p>';

        const picks = (data.picks || []).filter((p) => !p.hidden);
        if (picks.length) {
          document.getElementById('affiliateNote').textContent = data.affiliateNote || '';
          document.getElementById('picks').innerHTML = picks.map(renderPick).join('');
          document.getElementById('picksSection').hidden = false;
        }
      } catch (err) {
        console.error('Could not load editions.json', err);
        document.getElementById('books').innerHTML =
          '<p class="editions-empty">Could not load the list right now. Please try again later.</p>';
      }
    }

    load();
  </script>

</body>
</html>
