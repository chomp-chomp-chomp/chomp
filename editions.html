<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chomp Chomp Editions</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <meta name="description" content="Books from Chomp Chomp Editions, plus a few recommended reads.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chom.ps/editions">
  <meta property="og:title" content="Chomp Chomp Editions">
  <meta property="og:description" content="Books from Chomp Chomp Editions, plus a few recommended reads.">
  <meta property="twitter:card" content="summary">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Dark mode on this page is true black to match the header art */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #000000;
        --color-sidebar-bg: #000000;
        --color-border: #2a2626;
      }
      body, .site-header, .site-footer { background-color: #000000; }
    }

    .editions-intro {
      text-align: center;
      padding: 24px 20px 0;
    }

    .editions-intro p {
      font-size: 0.95em;
      color: var(--color-text-muted);
      margin: 0 0 6px;
    }

    .editions-section {
      max-width: 680px;
      margin: 0 auto 36px;
      padding: 0 20px;
    }

    .editions-header {
      font-size: 1.2em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text);
      text-align: center;
      margin: 36px 0 16px;
    }

    /* Recommended groups: each is a quiet accordion card. Closed by default; the header
       carries a count, a Show/Hide label and a chevron so it reads as clickable. */
    .rec-group {
      margin-top: 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-sidebar-bg);
    }

    .rec-group:first-child {
      margin-top: 8px;
    }

    .rec-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      cursor: pointer;
      list-style: none;
      border-radius: 10px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .rec-summary::-webkit-details-marker {
      display: none;
    }

    .rec-summary:hover {
      background: rgba(231, 59, 66, 0.06);
    }

    .rec-summary:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .rec-group[open] > .rec-summary {
      border-bottom: 1px solid var(--color-border);
      border-radius: 10px 10px 0 0;
    }

    .rec-text {
      flex: 1;
      min-width: 0;
    }

    .rec-heading {
      font-size: 1.05em;
      font-weight: 600;
      color: var(--color-text);
      margin: 0;
      line-height: 1.3;
    }

    .rec-desc {
      font-size: 0.85em;
      color: var(--color-text-muted);
      margin: 3px 0 0;
      line-height: 1.45;
    }

    .rec-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      font-size: 0.8em;
      color: var(--color-text-muted);
    }

    .rec-count {
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 0 8px;
      line-height: 1.6;
    }

    .rec-label {
      color: var(--color-accent);
      font-weight: 500;
    }

    .rec-group[open] .rec-label-show,
    .rec-group:not([open]) .rec-label-hide {
      display: none;
    }

    .rec-chev {
      color: var(--color-accent);
      transition: transform 0.2s;
    }

    .rec-group[open] .rec-chev {
      transform: rotate(180deg);
    }

    .rec-items {
      padding: 0 16px 6px;
    }

    .rec-items .book:first-child,
    .rec-items .pick:first-child {
      border-top: 0;
    }

    .rec-items .book:last-child,
    .rec-items .pick:last-child {
      border-bottom: 0;
    }

    /* Recommended entries are secondary to the Editions books, so they run a size smaller */
    .rec-items .book {
      padding: 16px 0;
      gap: 16px;
    }

    .rec-items .book-cover {
      flex: 0 0 84px;
    }

    .rec-items .book-cover img {
      width: 84px;
    }

    .rec-items .book-more .book-cover {
      flex: 0 0 72px;
    }

    .rec-items .book-more .book-cover img {
      width: 72px;
    }

    .rec-items .book-title {
      font-size: 1.05em;
    }

    .rec-items .book-subtitle {
      font-size: 0.85em;
    }

    .rec-items .book-meta {
      font-size: 0.75em;
      margin-bottom: 8px;
    }

    .rec-items .tags {
      margin-bottom: 8px;
    }

    .rec-items .tag {
      font-size: 0.68em;
    }

    .rec-items .book-desc p {
      font-size: 0.875em;
      line-height: 1.55;
    }

    .rec-items .book-links {
      margin-top: 10px;
    }

    .rec-items .book-links .btn {
      font-size: 0.8em;
      padding: 6px 14px;
    }

    .rec-items .expand-btn {
      font-size: 0.8em;
    }

    .rec-items .pick-title {
      font-size: 0.95em;
    }

    /* Tag filter */
    .tag-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 20px auto 0;
      max-width: 680px;
      padding: 0 20px;
    }

    .tag-chip {
      font-family: inherit;
      font-size: 0.8em;
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: 20px;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tag-chip:hover,
    .tag-chip.active {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
    }

    .tag {
      font-size: 0.72em;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 1px 9px;
    }

    /* Full entries */
    .book {
      display: flex;
      gap: 24px;
      padding: 24px 0;
      border-top: 1px solid var(--color-border);
    }

    .book:last-child {
      border-bottom: 1px solid var(--color-border);
    }

    .book-cover {
      flex: 0 0 150px;
    }

    .book-cover img {
      width: 150px;
      height: auto;
      display: block;
      border-radius: 3px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
    }

    .book-body {
      flex: 1;
      min-width: 0;
    }

    .book-status {
      font-size: 0.7em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--color-accent);
      margin: 0 0 6px;
    }

    .book-title {
      font-size: 1.35em;
      font-weight: 500;
      line-height: 1.3;
      margin: 0 0 2px;
    }

    .book-subtitle {
      font-size: 0.95em;
      color: var(--color-text-muted);
      margin: 0 0 4px;
    }

    .book-meta {
      font-size: 0.8em;
      color: var(--color-text-muted);
      margin: 0 0 14px;
    }

    .book-desc p {
      font-size: 0.95em;
      line-height: 1.65;
      margin: 0 0 12px;
    }

    .book-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .book-links .btn {
      text-decoration: none;
      font-size: 0.875em;
      padding: 8px 18px;
    }

    /* Compact entries */
    .affiliate-note {
      font-size: 0.8em;
      color: var(--color-text-muted);
      text-align: center;
      margin: 0 0 8px;
    }

    .pick {
      display: flex;
      gap: 14px;
      align-items: baseline;
      padding: 14px 0;
      border-top: 1px solid var(--color-border);
    }

    .pick:last-child {
      border-bottom: 1px solid var(--color-border);
    }

    .pick-main {
      flex: 1;
      min-width: 0;
    }

    .pick-title {
      display: block;
      font-weight: 500;
      color: var(--color-text);
      text-decoration: none;
      line-height: 1.4;
    }

    .pick-title:hover {
      color: var(--color-accent);
    }

    .pick-by {
      font-size: 0.85em;
      color: var(--color-text-muted);
      margin: 2px 0 0;
      line-height: 1.5;
    }

    .pick-links {
      display: flex;
      gap: 12px;
      white-space: nowrap;
      font-size: 0.8em;
    }

    .pick-links a {
      color: var(--color-accent);
      text-decoration: none;
    }

    .pick-links a:hover {
      text-decoration: underline;
    }

    .aff-flag {
      font-size: 0.7em;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    /* Purchase buttons: label on top, optional price beneath, affiliate tag under the button */
    .book-links {
      align-items: flex-start;
    }

    .link-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .book-links .btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.25;
      text-align: center;
    }

    .btn-price {
      font-size: 0.8em;
      opacity: 0.9;
    }

    .pick-links {
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pick-link {
      white-space: nowrap;
    }

    .pick-price {
      color: var(--color-text-muted);
    }

    /* Collapsible entries */
    .expand-btn {
      font-family: inherit;
      font-size: 0.875em;
      padding: 8px 4px;
      background: none;
      border: none;
      color: var(--color-accent);
      cursor: pointer;
    }

    .expand-btn:hover {
      text-decoration: underline;
    }

    .expand-btn .chev {
      display: inline-block;
      transition: transform 0.2s;
    }

    .expand-btn[aria-expanded="true"] .chev {
      transform: rotate(180deg);
    }

    .book-more {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }

    .book-more[hidden] {
      display: none;
    }

    .book-more .book-cover {
      flex: 0 0 120px;
    }

    .book-more .book-cover img {
      width: 120px;
    }

    .editions-empty {
      text-align: center;
      color: var(--color-text-muted);
      padding: 24px 0;
    }

    @media (max-width: 768px) {
      /* Phones: stack the cover above the text, everything left-aligned */
      .book {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .book-body {
        width: 100%;
      }

      .book-more {
        flex-direction: column;
        align-items: flex-start;
      }

      .link-wrap {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="site-nav">
      <div class="header-left"></div>

      <div class="header-center">
        <a href="https://chom.ps" title="Chomp Chomp">
          <img src="https://ik.imagekit.io/chompchomp/editions-light.jpg" alt="Chomp Chomp Editions" class="header-banner banner-light">
          <img src="https://ik.imagekit.io/chompchomp/editions-dark.PNG" alt="Chomp Chomp Editions" class="header-banner banner-dark">
        </a>
      </div>

      <div class="header-right">
        <div class="nav-tools-dropdown">
          <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">☰</button>
          <ul class="tools-dropdown-menu" id="toolsDropdown">
            <li><a href="https://chom.ps">Home</a></li>
            <li><a href="https://ps.chom.ps">.ps</a></li>
            <li><a href="https://chom.ps/about">About</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="page-container">

    <div class="editions-intro">
      <p id="intro"></p>
    </div>

    <div class="tag-bar" id="tagBar" hidden></div>

    <section class="editions-section" id="booksSection">
      <div class="editions-header">Chomp Chomp Editions</div>
      <p class="affiliate-note" id="affNoteBooks" hidden></p>
      <div id="books"></div>
    </section>

    <section class="editions-section" id="picksSection" hidden>
      <div class="editions-header">Recommended</div>
      <p class="affiliate-note" id="affNotePicks" hidden></p>
      <div id="picks"></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Baking is the materialization of comfort itself.</p>
      <p style="margin-top: 20px; font-size: 0.85em;">&copy; 2026 Chomp Chomp</p>
    </div>
  </footer>

  <script>
    // Menu toggle
    const toggle = document.getElementById('menuToggle');
    const menu = document.getElementById('toolsDropdown');
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('active');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-tools-dropdown')) {
        menu.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    // Content comes from editions.json; escape everything before inserting
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Only allow http(s) links
    const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? esc(u) : '#';

    const paragraphs = (text) =>
      esc(text).split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

    // Affiliate status belongs to each link; older entries set it once on the item
    const isAff = (item, l) => (l.affiliate !== undefined ? !!l.affiliate : !!item.affiliate);
    const hasAff = (item) => (item.links || []).some((l) => isAff(item, l));
    const relFor = (item, l) => (isAff(item, l) ? 'sponsored noopener' : 'noopener');

    // One purchase button: format/store as the label, optional price beneath, visible affiliate tag
    function buyButton(item, l) {
      return `
        <span class="link-wrap">
          <a class="btn btn-primary" href="${safeUrl(l.url)}" target="_blank" rel="${relFor(item, l)}">
            <span class="btn-label">${esc(l.label || 'Buy')}</span>
            ${l.price ? `<span class="btn-price">${esc(l.price)}</span>` : ''}
          </a>
          ${isAff(item, l) ? '<span class="aff-flag">affiliate link</span>' : ''}
        </span>`;
    }

    let data = { items: [] };
    let activeTag = null;
    const expanded = new Set();   // indexes of collapsible items the visitor has opened
    const openedGroups = new Set(); // Recommended groups the visitor has opened (all start closed)

    function renderFull(b) {
      const links = (b.links || []).map((l) => buyButton(b, l)).join('');
      const tags = (b.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('');
      return `
        <article class="book">
          ${b.cover ? `<div class="book-cover"><img src="${esc(b.cover)}" alt="${esc(b.title)} cover" loading="lazy"></div>` : ''}
          <div class="book-body">
            ${b.status ? `<p class="book-status">${esc(b.status)}</p>` : ''}
            <h2 class="book-title">${esc(b.title)}</h2>
            ${b.subtitle ? `<p class="book-subtitle">${esc(b.subtitle)}</p>` : ''}
            <p class="book-meta">${[b.author, b.details].filter(Boolean).map(esc).join(' · ')}</p>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
            ${b.description ? `<div class="book-desc">${paragraphs(b.description)}</div>` : ''}
            ${links ? `<div class="book-links">${links}</div>` : ''}
          </div>
        </article>`;
    }

    function renderCompact(p) {
      const links = (p.links || []).map((l) =>
        `<span class="pick-link"><a href="${safeUrl(l.url)}" target="_blank" rel="${relFor(p, l)}">${esc(l.label || 'Link')}</a>${l.price ? ` <span class="pick-price">${esc(l.price)}</span>` : ''}${isAff(p, l) ? ' <span class="aff-flag">affiliate</span>' : ''}</span>`
      ).join('');
      return `
        <div class="pick">
          <div class="pick-main">
            <span class="pick-title">${esc(p.title)}</span>
            ${p.author ? `<p class="pick-by">${esc(p.author)}</p>` : ''}
          </div>
          ${links ? `<div class="pick-links">${links}</div>` : ''}
        </div>`;
    }

    // Collapsed by default: summary and buy buttons show, cover and description sit behind a toggle
    function renderCollapsible(b) {
      const idx = data.items.indexOf(b);
      const open = expanded.has(idx);
      const hasMore = b.description || b.cover;
      const links = (b.links || []).map((l) => buyButton(b, l)).join('');
      const tags = (b.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('');
      const toggle = hasMore
        ? `<button type="button" class="expand-btn" data-idx="${idx}" aria-expanded="${open}" aria-controls="more-${idx}">
             <span class="expand-label">${open ? 'Less' : 'More'}</span> <span class="chev" aria-hidden="true">▾</span>
           </button>`
        : '';
      const more = hasMore
        ? `<div class="book-more" id="more-${idx}"${open ? '' : ' hidden'}>
             ${b.cover ? `<div class="book-cover"><img src="${esc(b.cover)}" alt="${esc(b.title)} cover" loading="lazy"></div>` : ''}
             ${b.description ? `<div class="book-desc">${paragraphs(b.description)}</div>` : ''}
           </div>`
        : '';
      return `
        <article class="book">
          <div class="book-body">
            ${b.status ? `<p class="book-status">${esc(b.status)}</p>` : ''}
            <h2 class="book-title">${esc(b.title)}</h2>
            ${b.subtitle ? `<p class="book-subtitle">${esc(b.subtitle)}</p>` : ''}
            <p class="book-meta">${[b.author, b.details].filter(Boolean).map(esc).join(' · ')}</p>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
            ${(links || toggle) ? `<div class="book-links">${links}${toggle}</div>` : ''}
            ${more}
          </div>
        </article>`;
    }

    // "display" is full | compact | collapsible (older entries used a compact flag)
    const modeOf = (i) => i.display || (i.compact ? 'compact' : 'full');
    const renderItem = (i) => {
      const m = modeOf(i);
      return m === 'compact' ? renderCompact(i) : m === 'collapsible' ? renderCollapsible(i) : renderFull(i);
    };

    function render() {
      const visible = (data.items || []).filter((i) => !i.hidden);
      const shown = activeTag
        ? visible.filter((i) => (i.tags || []).includes(activeTag))
        : visible;

      // Tag filter bar: built from every visible item's tags
      const allTags = [...new Set(visible.flatMap((i) => i.tags || []))].sort((a, b) => a.localeCompare(b));
      const bar = document.getElementById('tagBar');
      bar.hidden = allTags.length === 0;
      bar.innerHTML = allTags.map((t) =>
        `<button class="tag-chip${t === activeTag ? ' active' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`
      ).join('');

      // Section and affiliate status are independent settings on each item
      const own = shown.filter((i) => i.section !== 'recommended');
      const picks = shown.filter((i) => i.section === 'recommended');

      document.getElementById('booksSection').hidden = own.length === 0;
      document.getElementById('books').innerHTML = own.map(renderItem).join('');

      // Recommended items are grouped by category, in the order set in editions.json.
      // An item with no (or an unknown) category goes under "Other".
      // Categories may be plain names or { name, description } objects.
      const rawCats = (data.categories && data.categories.length) ? data.categories : ['Books', 'Kitchen', 'Other'];
      const cats = rawCats
        .map((c) => (typeof c === 'string' ? { name: c, description: '' } : { name: c.name || '', description: c.description || '' }))
        .filter((c) => c.name);
      if (!cats.some((c) => c.name.toLowerCase() === 'other')) cats.push({ name: 'Other', description: '' });
      const groups = new Map(cats.map((c) => [c.name.toLowerCase(), { ...c, items: [] }]));
      picks.forEach((i) => {
        const g = groups.get(String(i.category || '').toLowerCase()) || groups.get('other');
        g.items.push(i);
      });

      document.getElementById('picksSection').hidden = picks.length === 0;
      document.getElementById('picks').innerHTML = [...groups.values()]
        .filter((g) => g.items.length)
        .map((g) => `
          <details class="rec-group" data-group="${esc(g.name)}"${(activeTag || openedGroups.has(g.name)) ? ' open' : ''}>
            <summary class="rec-summary">
              <div class="rec-text">
                <h3 class="rec-heading">${esc(g.name)}</h3>
                ${g.description ? `<p class="rec-desc">${esc(g.description)}</p>` : ''}
              </div>
              <div class="rec-meta">
                <span class="rec-count" title="${g.items.length} item${g.items.length === 1 ? '' : 's'}">${g.items.length}</span>
                <span class="rec-label rec-label-show">Show</span>
                <span class="rec-label rec-label-hide">Hide</span>
                <span class="rec-chev" aria-hidden="true">▾</span>
              </div>
            </summary>
            <div class="rec-items">${g.items.map(renderItem).join('')}</div>
          </details>`)
        .join('');

      // Visible disclosure sits directly above any section that contains an affiliate item
      [['affNoteBooks', own], ['affNotePicks', picks]].forEach(([id, list]) => {
        const note = document.getElementById(id);
        note.textContent = data.affiliateNote || '';
        note.hidden = !(data.affiliateNote && list.some(hasAff));
      });

      if (!own.length && !picks.length) {
        document.getElementById('booksSection').hidden = false;
        document.getElementById('books').innerHTML = '<p class="editions-empty">Nothing here yet.</p>';
      }
    }

    // Remember opened groups so a tag filter re-render doesn't close them again.
    // "toggle" doesn't bubble, so listen in the capture phase. While a tag filter is on,
    // groups are forced open and their state isn't recorded.
    document.addEventListener('toggle', (e) => {
      const d = e.target;
      if (!d.classList || !d.classList.contains('rec-group') || activeTag) return;
      if (d.open) openedGroups.add(d.dataset.group); else openedGroups.delete(d.dataset.group);
    }, true);

    // Expand / collapse (no re-render, so scroll position stays put)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.expand-btn');
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      const panel = document.getElementById('more-' + idx);
      const open = panel.hidden;          // currently closed -> opening
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open);
      btn.querySelector('.expand-label').textContent = open ? 'Less' : 'More';
      if (open) expanded.add(idx); else expanded.delete(idx);
    });

    document.getElementById('tagBar').addEventListener('click', (e) => {
      const chip = e.target.closest('.tag-chip');
      if (!chip) return;
      activeTag = activeTag === chip.dataset.tag ? null : chip.dataset.tag;
      render();
    });

    async function load() {
      try {
        const res = await fetch('/editions.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(res.status);
        data = await res.json();
        document.getElementById('intro').textContent = data.intro || '';
        render();
      } catch (err) {
        console.error('Could not load editions.json', err);
        document.getElementById('books').innerHTML =
          '<p class="editions-empty">Could not load the list right now. Please try again later.</p>';
      }
    }

    load();
  </script>

</body>
</html>
